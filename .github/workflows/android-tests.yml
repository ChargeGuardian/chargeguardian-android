name: Escudo Android tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew testFreeDebugUnitTest --stacktrace
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

  free-manifest:
    name: Free build must not declare SMS permissions or the notification listener
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build merged free manifest
        run: ./gradlew processFreeDebugMainManifest --stacktrace
      - name: Fail if free manifest declares SMS permissions
        run: |
          M=app/build/intermediates/merged_manifest/freeDebug/AndroidManifest.xml
          if grep -E "NotificationScanService|RECEIVE_SMS|READ_SMS" "$M"; then
            echo "Free build must not declare SMS permissions or the notification listener"
            exit 1
          fi

  smoke:
    name: Emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew connectedProDebugAndroidTest --stacktrace
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-reports
          path: app/build/reports/androidTests/

  open-issue-on-failure:
    name: Open issue on failure
    runs-on: ubuntu-latest
    needs: [unit, free-manifest, smoke]
    if: failure() && github.ref == 'refs/heads/main'
    permissions:
      issues: write
    steps:
      - name: Create issue unless one is already open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN=$(gh issue list --repo "${{ github.repository }}" --state open --search "Escudo tests failing on main in:title" --json number --jq 'length')
          if [ "$OPEN" = "0" ]; then
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "Escudo tests failing on main" \
              --body "First seen on ${{ github.sha }} (${{ github.event_name }} run): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "An open failure issue already exists; not creating another."
          fi
